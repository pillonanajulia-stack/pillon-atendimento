<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PILLON | Atendimento</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .painel {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 16px;
      padding: 38px;
      box-shadow: 0 8px 30px rgba(0,0,0,.10);
    }

    .marca {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .subtitulo {
      text-align: center;
      font-size: 13px;
      color: #777;
      margin-bottom: 35px;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .descricao {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 17px;
      margin-bottom: 18px;
    }

    input:focus {
      outline: 2px solid #222;
      border-color: transparent;
    }

    button {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 8px;
      background: #1d1d1f;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .9;
    }

    .aviso {
      margin-top: 22px;
      padding: 14px;
      background: #f6f6f6;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    #resultado {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #eef7ee;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="painel">

    <div class="marca">PILLON</div>
    <div class="subtitulo">PAINEL ADMINISTRATIVO</div>

    <h1>Finalizar atendimento</h1>

    <div class="descricao">
      Informe o telefone do cliente para encerrar o atendimento atual.
    </div>

    <label for="telefone">Telefone do cliente</label>

    <input
      type="tel"
      id="telefone"
      placeholder="(14) 99729-5315"
      autocomplete="off"
    >

    <button type="button" onclick="simularFinalizacao()">
      FINALIZAR ATENDIMENTO
    </button>

    <div id="resultado">
      Página de teste funcionando corretamente.
    </div>

    <div class="aviso">
      Após a finalização, na próxima mensagem o cliente será tratado
      como um novo atendimento e receberá o menu inicial.
    </div>

  </div>

  <script>
    function simularFinalizacao() {
      const telefone = document.getElementById("telefone").value.trim();
      const resultado = document.getElementById("resultado");

      if (!telefone) {
        alert("Informe o telefone do cliente.");
        return;
      }

      resultado.style.display = "block";
    }
  </script>

</body>
</html>
